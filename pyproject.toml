[project]
name = "asli-vox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satyam Vishwakarma", email = "officialsatyamvishwakarma06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "librosa>=1.0.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "setuptools>=84.0.0",
    "streamlit>=1.59.2",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
    "webrtcvad>=2.0.10",
    "websockets>=17.1",
]

[project.scripts]
asli-vox = "asli_vox:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
